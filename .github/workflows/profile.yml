name: profile

# Rebuilds the profile page:
#   1. profile/build.py reads profile/config.toml and live GitHub numbers,
#      draws the terminal and stack images, and refreshes the README sections
#   2. Platane/snk draws the contribution snake in neutral greys
#   3. all images go to the "output" branch, which the README links to
#   4. the README is committed only if something in it changed

on:
  schedule:
    - cron: "23 4 * * *"      # every day at 04:23 UTC (07:23 in Nairobi)
  workflow_dispatch:           # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - "profile/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Get icons (skill-icons, MIT)
        run: git clone --depth 1 https://github.com/tandpfun/skill-icons.git "$RUNNER_TEMP/skill-icons"

      - name: Build terminal, stack and README sections
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 profile/build.py --icons "$RUNNER_TEMP/skill-icons/icons"

      # Neutral snake. color_dots is five colours: no contributions first,
      # then light to heavy days. Both use GitHub's own greys.
      - name: Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#57606A&color_dots=#EBEDF0,#D0D7DE,#AFB8C1,#8C959F,#6E7781
            dist/snake-dark.svg?palette=github-dark&color_snake=#C9D1D9&color_dots=#161B22,#30363D,#484F58,#6E7681,#8B949E

      - name: Publish images to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit README if it changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh live README sections"
          git push
